<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#FF6B35">
    <title>生活小秘</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Android全屏：无手机外壳，直接页面容器 -->
        <div class="page-container" id="page-container" style="padding-top: var(--safe-top, 0px);">

            <!-- ========== 首页 ========== -->
            <div class="page page-home active" id="page-home" data-page="home">
                <div class="page-scroll">
                    <!-- 搜索栏 -->
                    <div class="home-search-bar">
                        <div class="location-tag">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z" fill="#FF6B35"/></svg>
                            <span>深圳·南山</span>
                        </div>
                        <div class="search-input" onclick="toggleSearch(true)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z" fill="#8E8E93"/></svg>
                            <span class="search-placeholder">搜索美食、足疗、景点...</span>
                        </div>
                        <div class="search-btn">搜索</div>
                    </div>

                    <!-- 搜索弹层 -->
                    <div class="search-overlay" id="searchOverlay">
                        <div class="search-overlay-header">
                            <div class="search-overlay-input">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z" fill="#8E8E93"/></svg>
                                <input type="text" id="searchInput" placeholder="搜索美食、足疗、景点..." />
                            </div>
                            <span class="search-cancel" onclick="toggleSearch(false)">取消</span>
                        </div>
                        <div class="search-hot">
                            <div class="search-hot-title">热门搜索</div>
                            <div class="search-hot-tags" id="searchHotTags"></div>
                        </div>
                    </div>

                    <!-- 分类入口 -->
                    <div class="category-grid" id="categoryGrid"></div>

                    <!-- 热门轮播 -->
                    <div class="section-header">
                        <h3>热门推荐</h3>
                        <span class="more-link">查看全部 ›</span>
                    </div>
                    <div class="banner-carousel" id="bannerCarousel">
                        <div class="carousel-track" id="carouselTrack"></div>
                        <div class="carousel-dots" id="carouselDots"></div>
                    </div>

                    <!-- 附近热门商家 -->
                    <div class="section-header">
                        <h3>附近热门</h3>
                        <span class="more-link">更多商家 ›</span>
                    </div>
                    <div class="merchant-list" id="merchantList"></div>

                    <!-- 特价美食 -->
                    <div class="section-header">
                        <h3>🔥 特价美食</h3>
                        <span class="more-link">全部优惠 ›</span>
                    </div>
                    <div class="deal-cards" id="dealCards"></div>

                    <!-- 优惠商品 -->
                    <div class="section-header">
                        <h3>⚡ 限时秒杀</h3>
                        <div class="flash-sale-timer" id="flashTimer">02:35:48</div>
                    </div>
                    <div class="flash-sale-list" id="flashSaleList"></div>

                    <div style="height: 80px;"></div>
                </div>
            </div>

            <!-- ========== 推荐页 ========== -->
            <div class="page page-recommend" id="page-recommend" data-page="recommend">
                <div class="page-scroll">
                    <div class="recommend-header">
                        <h2 class="page-title">为你推荐</h2>
                        <div class="recommend-subtitle">基于你的偏好，千人千面</div>
                    </div>
                    <div class="interest-bar">
                        <div class="interest-label">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6L12 2z" fill="#FFB627"/></svg>
                            <span>兴趣偏好</span>
                        </div>
                        <div class="interest-tags" id="interestTags"></div>
                        <div class="interest-edit" onclick="toggleInterestPanel(true)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="#FF6B35"/></svg>
                            <span>编辑</span>
                        </div>
                    </div>
                    <div class="interest-panel-overlay" id="interestPanel">
                        <div class="interest-panel">
                            <div class="interest-panel-header">
                                <span onclick="toggleInterestPanel(false)">取消</span>
                                <h3>选择你感兴趣的品类</h3>
                                <span class="confirm-btn" onclick="saveInterests()">完成</span>
                            </div>
                            <div class="interest-panel-body" id="interestPanelBody"></div>
                        </div>
                    </div>
                    <div class="recommend-feed" id="recommendFeed"></div>
                    <div style="height: 80px;"></div>
                </div>
            </div>

            <!-- ========== 小秘智能体页 ========== -->
            <div class="page page-assistant" id="page-assistant" data-page="assistant">
                <div class="assistant-header">
                    <div class="assistant-avatar">
                        <svg width="32" height="32" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FF6B35"/><path d="M8 10h8M8 14h5" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="8" r="1.5" fill="#fff"/><circle cx="15" cy="8" r="1.5" fill="#fff"/></svg>
                    </div>
                    <div class="assistant-info">
                        <h2>小秘</h2>
                        <p>你的智能生活管家</p>
                    </div>
                </div>
                <div class="quick-actions">
                    <div class="quick-action-title">小秘帮你办</div>
                    <div class="quick-action-grid" id="quickActionGrid"></div>
                </div>
                <div class="chat-area" id="chatArea"></div>
                <div class="chat-input-bar">
                    <div class="chat-input-wrapper">
                        <input type="text" id="chatInput" placeholder="跟小秘说点什么..." />
                        <div class="chat-send-btn" onclick="sendMessage()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="#fff"/></svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ========== 上新页 ========== -->
            <div class="page page-newest" id="page-newest" data-page="newest">
                <div class="page-scroll">
                    <div class="newest-header">
                        <h2 class="page-title">上新</h2>
                        <div class="newest-subtitle">发现身边新品好去处</div>
                    </div>
                    <div class="newest-filter-bar" id="newestFilterBar"></div>
                    <div class="newest-feed" id="newestFeed"></div>
                    <div style="height: 80px;"></div>
                </div>
            </div>

            <!-- ========== 个人中心页 ========== -->
            <div class="page page-profile" id="page-profile" data-page="profile">
                <div class="page-scroll">
                    <div class="profile-header">
                        <div class="profile-bg"></div>
                        <div class="profile-user-card">
                            <div class="profile-avatar" id="profileAvatar"></div>
                            <div class="profile-user-info">
                                <div class="profile-name" id="profileName">乐享用户</div>
                                <div class="profile-level">
                                    <span class="level-badge">VIP3</span>
                                    <span class="level-text">黄金会员</span>
                                </div>
                                <div class="profile-stats">
                                    <div class="stat-item">
                                        <span class="stat-num">128</span>
                                        <span class="stat-label">关注</span>
                                    </div>
                                    <div class="stat-item">
                                        <span class="stat-num">356</span>
                                        <span class="stat-label">粉丝</span>
                                    </div>
                                    <div class="stat-item">
                                        <span class="stat-num">89</span>
                                        <span class="stat-label">动态</span>
                                    </div>
                                </div>
                            </div>
                            <div class="profile-edit-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="#FF6B35"/></svg>
                            </div>
                        </div>
                    </div>
                    <div class="profile-assets">
                        <div class="asset-item">
                            <span class="asset-num">¥2,580</span>
                            <span class="asset-label">钱包余额</span>
                        </div>
                        <div class="asset-divider"></div>
                        <div class="asset-item">
                            <span class="asset-num">36</span>
                            <span class="asset-label">优惠券</span>
                        </div>
                        <div class="asset-divider"></div>
                        <div class="asset-item">
                            <span class="asset-num">5,890</span>
                            <span class="asset-label">积分</span>
                        </div>
                    </div>
                    <div class="profile-section">
                        <div class="section-header">
                            <h3>我的订单</h3>
                            <span class="more-link">全部订单 ›</span>
                        </div>
                        <div class="order-grid" id="orderGrid"></div>
                    </div>
                    <div class="profile-section">
                        <div class="section-header">
                            <h3>常用功能</h3>
                        </div>
                        <div class="func-grid" id="funcGrid"></div>
                    </div>
                    <div class="profile-section">
                        <div class="section-header">
                            <h3>系统设置</h3>
                        </div>
                        <div class="settings-list" id="settingsList"></div>
                    </div>
                    <div style="height: 80px;"></div>
                </div>
            </div>
        </div>

        <!-- 底部导航栏 -->
        <div class="tab-bar" id="tabBar"></div>

        <!-- 互动弹窗 -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-content" id="modalContent"></div>
        </div>

        <!-- Toast提示 -->
        <div class="toast" id="toast"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
    // Android native bridge - set safe area padding
    if (window.__NATIVE_INFO__) {
        document.documentElement.style.setProperty('--safe-top', window.__NATIVE_INFO__.statusBarHeight + 'px');
    }
    window.onNativeReady = function(info) {
        document.documentElement.style.setProperty('--safe-top', info.statusBarHeight + 'px');
    };
    </script>
</body>
</html>
