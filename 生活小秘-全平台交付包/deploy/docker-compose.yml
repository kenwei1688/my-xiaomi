# ==================== 生活小秘 - Docker Compose 一键部署 ====================
# 用法：在项目根目录执行
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 部署后访问：
#   http://服务器IP:3000        （直接访问）
#   或通过下方 nginx 反向代理 + HTTPS 访问（推荐）

services:
  lexiang:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lexiang-life:latest
    container_name: lexiang-life
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    # 生产建议：数据持久化（当前为内存数据库，预留卷位置）
    # volumes:
    #   - lexiang-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

