# ==================== 生活小秘 - Nginx 反向代理配置 ====================
# 放置位置：/etc/nginx/conf.d/lexiang.conf
# 需将 lexiang.example.com 替换为你的真实域名（已完成 ICP 备案）

# HTTP -> HTTPS 强制跳转
server {
    listen 80;
    server_name lexiang.example.com;

    # Let's Encrypt 证书申请验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl http2;
    server_name lexiang.example.com;

    # SSL 证书（使用 certbot 申请后会自动替换为真实路径）
    ssl_certificate     /etc/letsencrypt/live/lexiang.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lexiang.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全响应头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # 请求体大小限制（评论/上传等）
    client_max_body_size 10m;

    # 所有请求代理到后端 Node 服务
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存（图片/CSS/JS）
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 后端健康检查（可配置监控探活）
    location = /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        access_log off;
    }
}
